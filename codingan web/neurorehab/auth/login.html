<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NeuroRehab Glove AI</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-visual">
            <div class="visual-content">
                <div class="logo-large">
                    <i class="fas fa-hand-sparkles"></i>
                    <h1>NeuroRehab<span class="gradient-text">AI</span></h1>
                </div>
                <p class="tagline">Rehabilitasi Stroke Lebih Cerdas</p>

                <div class="features-mini">
                    <div class="feature-mini">
                        <i class="fas fa-gamepad"></i>
                        <span>Game Terapi Interaktif</span>
                    </div>
                    <div class="feature-mini">
                        <i class="fas fa-heartbeat"></i>
                        <span>Monitoring Jantung Real-time</span>
                    </div>
                    <div class="feature-mini">
                        <i class="fas fa-brain"></i>
                        <span>AI Detection 98% Akurat</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="auth-form-container">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h2>Selamat Datang Kembali</h2>
                    <p>Masuk ke akun Anda untuk melanjutkan rehabilitasi</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Masukkan password"
                                required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Ingat saya</span>
                        </label>
                        <a href="forgot-password.html" class="link-primary">Lupa password?</a>
                    </div>

                    <div class="form-group">
                        <label for="role">Login sebagai</label>
                        <div class="role-selector">
                            <label class="role-option">
                                <input type="radio" name="role" value="patient" checked>
                                <div class="role-card">
                                    <i class="fas fa-user"></i>
                                    <span>Pasien</span>
                                </div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="therapist">
                                <div class="role-card">
                                    <i class="fas fa-user-md"></i>
                                    <span>Fisioterapis</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-sign-in-alt"></i>
                        Masuk
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Belum punya akun? <a href="register.html" class="link-primary">Daftar sekarang</a></p>
                </div>

                <div class="divider">
                    <span>atau</span>
                </div>

                <div class="demo-section">
                    <p class="demo-text">Coba demo tanpa login:</p>
                    <button type="button" class="btn btn-outline btn-full" onclick="enterDemoMode()">
                        <i class="fas fa-play-circle"></i>
                        Mode Demo
                    </button>
                </div>
            </div>

            <div class="back-to-home">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i>
                    Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
