version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    working_dir: /app/backend
    command: ["nodemon", "--legacy-watch", "--exec", "python", "server.py"]
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    working_dir: /app/frontend
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    depends_on:
      - backend
