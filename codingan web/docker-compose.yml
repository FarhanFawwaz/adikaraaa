version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: adikaraaa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adikaraaa_db
      MYSQL_USER: adikaraaa
      MYSQL_PASSWORD: adikaraaa123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: adikaraaa_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    working_dir: /app/backend
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload" ]
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=adikaraaa_db
      - DB_USER=adikaraaa
      - DB_PASSWORD=adikaraaa123
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  bridge-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: bridge-server
    working_dir: /app/bridge-server
    ports:
      - "8082:8080" # Mapped to 8082 to avoid conflict with backend on 8080
    environment:
      - PORT=8080
      - FIREBASE_DATABASE_URL=https://neurorehab-58cd1-default-rtdb.asia-southeast1.firebasedatabase.app
      - FIREBASE_PATH_LATEST=/device1/latest
    volumes:
      - ./bridge-server:/app/bridge-server
      - bridge_server_node_modules:/app/bridge-server/node_modules
      # Require user to mount service account if using bridge-server
      # - ./bridge-server/firebase-service-account.json:/app/bridge-server/firebase-service-account.json
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    working_dir: /app/frontend
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
    volumes:
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:
  node_modules:
  bridge_server_node_modules:
